[project]
name = "job-apply-agent-backend"
version = "0.1.0"
description = "Local FastAPI backend for Apply Copilot: profile vault, resume import, field matching and LLM agents."
requires-python = ">=3.10"
dependencies = [
    # --- Web API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    # --- Database ---
    "sqlalchemy>=2.0",
    # --- Profile catalog + synonyms ---
    "pyyaml>=6.0",
    # --- Resume import ---
    "pypdf>=4.2",
    "python-docx>=1.1",
    # --- LLM providers ---
    "anthropic>=0.70",
    "httpx>=0.27",
    # --- Secrets (API keys stored in the OS credential vault) ---
    "keyring>=25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "reportlab>=4.2",  # builds PDF resumes for the import tests
]

[tool.uv]
# This is an application, not a library: install its dependencies only.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
